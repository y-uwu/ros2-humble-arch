# To move a recipe to a newer AUR commit: change the hash here, run
# `./build.sh deps`, and if its patch no longer applies, redo the change by hand
# in deps/aur/<name> and save it with `git -C deps/aur/<name> diff > deps/patches/<name>.patch`.
